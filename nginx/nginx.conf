# Nginx chạy bằng user không đặc quyền (image nginxinc/nginx-unprivileged, UID 101)
# nên pid và các thư mục tạm đặt trong /tmp (container chạy read-only).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # ----- Hardening chung -----
  server_tokens off;                 # ẩn phiên bản Nginx
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 15s;

  # ----- Log dạng JSON để Loki/LogQL phân tích -----
  log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"host":"$host"'
  '}';
  access_log /var/log/nginx/access.log json;

  # ----- Chống brute-force / DoS đơn giản -----
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  # Chỉ giới hạn POST /login (GET trang đăng nhập không bị tính)
  map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
  }
  limit_req_zone $login_limit_key    zone=login:10m  rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  sendfile on;
  tcp_nopush on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  include /etc/nginx/conf.d/*.conf;
}
