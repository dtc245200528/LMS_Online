map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream lms_app {
  server app:3000;
  keepalive 16;
}

# ---------- HTTP: chỉ chuyển hướng sang HTTPS ----------
server {
  listen 8080;
  server_name _;
  return 301 https://$host$request_uri;
}

# ---------- HTTPS (chứng chỉ tự ký) ----------
server {
  listen 8443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/lms.crt;
  ssl_certificate_key /etc/nginx/certs/lms.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  include /etc/nginx/snippets/security-headers.conf;

  limit_conn perip 30;

  # Chặn file ẩn (.env, .git ...)
  location ~ /\. {
    deny all;
    return 404;
  }

  # Endpoint nội bộ: không cho truy cập từ Internet
  location = /metrics { return 404; }
  location ^~ /internal/ { return 404; }   # webhook cảnh báo chỉ dùng trong mạng nội bộ
  location = /readyz  { return 404; }

  # Trang đăng nhập: giới hạn tần suất chống brute-force
  location = /login {
    limit_req zone=login burst=5 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://lms_app;
  }

  # Ứng dụng LMS
  location / {
    limit_req zone=general burst=40 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://lms_app;
  }

  # Grafana (đăng nhập bằng tài khoản Grafana; serve_from_sub_path=true nên giữ nguyên tiền tố)
  location /grafana/ {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://grafana:3000;
  }
  location /grafana/api/live/ {
    proxy_http_version 1.1;
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://grafana:3000;
  }

  # Prometheus không có đăng nhập riêng -> bắt buộc Basic Auth
  location /prometheus/ {
    auth_basic "Khu vuc quan tri";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://prometheus:9090/;
  }

  # Alertmanager: xem các cảnh báo đang kích hoạt (Basic Auth)
  location /alertmanager/ {
    auth_basic "Khu vuc quan tri";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://alertmanager:9093/;
  }

  # phpMyAdmin: thêm lớp Basic Auth trước màn hình đăng nhập MySQL
  location /phpmyadmin/ {
    auth_basic "Khu vuc quan tri";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;
    limit_req zone=general burst=40 nodelay;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass http://phpmyadmin:80/;
  }
}
