# stub_status cho nginx-prometheus-exporter.
# Cổng 8081 không publish ra máy host, chỉ cho phép từ mạng Docker nội bộ.
server {
  listen 8081;
  server_name _;
  access_log off;

  location = /stub_status {
    stub_status;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 127.0.0.1;
    deny all;
  }

  location / { return 404; }
}
