# Promtail: tự phát hiện container của project "lms" qua Docker API,
# đọc log stdout/stderr và đẩy về Loki kèm nhãn service / container / level.
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=lms"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - target_label: project
        replacement: lms
    pipeline_stages:
      # Ứng dụng LMS ghi log JSON (pino): lấy level làm nhãn, dùng thời gian trong log
      - match:
          selector: '{service="app"}'
          stages:
            - json:
                expressions:
                  level: level
                  time: time
            - labels:
                level:
            - timestamp:
                source: time
                format: RFC3339Nano
      # Nginx ghi access log JSON: phân loại status thành 2xx/3xx/4xx/5xx
      - match:
          selector: '{service="nginx", stream="stdout"}'
          stages:
            - json:
                expressions:
                  status: status
            - template:
                source: status_class
                template: '{{ if .status }}{{ printf "%.1s" .status }}xx{{ end }}'
            - labels:
                status_class:
