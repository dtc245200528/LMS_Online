# =============================================================
# Đề 17 - LMS đơn giản: triển khai toàn bộ bằng Docker Compose
# Chạy: ./scripts/setup.sh  &&  docker compose up -d --build
# =============================================================
name: lms

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------- Cơ sở dữ liệu ----------------
  mysql:
    <<: *hardening
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Chạy scripts/setup.sh để tạo .env}
      MYSQL_ROOT_HOST: localhost          # root chỉ đăng nhập được từ bên trong container
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lms}
      MYSQL_USER: ${MYSQL_USER:-lms_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      DBA_PASSWORD: ${DBA_PASSWORD:?}
      MYSQLD_EXPORTER_PASSWORD: ${MYSQLD_EXPORTER_PASSWORD:?}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --local-infile=0                  # tắt LOAD DATA LOCAL
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]                    # KHÔNG mở cổng 3306 ra ngoài
    healthcheck:
      # ping qua TCP: chỉ báo healthy khi server thật đã lắng nghe (sau khi chạy xong init)
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1g }

  # ---------------- Công cụ quản lý DB ----------------
  phpmyadmin:
    <<: *hardening
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://${DOMAIN:-localhost}/phpmyadmin/
      UPLOAD_LIMIT: 2M
      HIDE_PHP_VERSION: "true"
    volumes:
      - ./phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    networks: [frontend, backend]
    depends_on:
      mysql: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256m }

  # ---------------- Ứng dụng LMS (Node.js/Express) ----------------
  app:
    <<: *hardening
    build: ./app
    image: lms-app:1.0
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-lms}
      DB_USER: ${MYSQL_USER:-lms_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      COOKIE_SECURE: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      LOG_LEVEL: info
    user: "1000:1000"                      # user "node", không phải root
    read_only: true                        # filesystem chỉ đọc
    tmpfs: [/tmp]
    cap_drop: [ALL]                        # bỏ toàn bộ Linux capabilities
    networks: [frontend, backend, monitoring]
    depends_on:
      mysql: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

  # ---------------- Reverse proxy ----------------
  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/auth:/etc/nginx/auth:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [frontend, monitoring]
    depends_on:
      app: { condition: service_healthy }
      phpmyadmin: { condition: service_started }
      grafana: { condition: service_started }
      prometheus: { condition: service_started }
      alertmanager: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1:8443/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 128m }

  # =============== GIÁM SÁT: Prometheus + Grafana ===============
  prometheus:
    <<: *hardening
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.external-url=https://${DOMAIN:-localhost}/prometheus/
      - --web.route-prefix=/
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    user: "65534:65534"                    # nobody
    read_only: true
    cap_drop: [ALL]
    networks: [frontend, monitoring]       # truy cập qua Nginx /prometheus/ (Basic Auth)
    deploy:
      resources:
        limits: { memory: 512m }

  grafana:
    <<: *hardening
    image: grafana/grafana:11.3.0
    environment:
      GF_SERVER_DOMAIN: ${DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: https://${DOMAIN:-localhost}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_MODE: console
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    user: "472:0"                          # user grafana
    cap_drop: [ALL]
    networks: [frontend, monitoring]
    depends_on: [prometheus, loki, alertmanager]
    deploy:
      resources:
        limits: { memory: 512m }

  alertmanager:                            # nhận cảnh báo từ Prometheus và gửi đi
    <<: *hardening
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://${DOMAIN:-localhost}/alertmanager/
      - --web.route-prefix=/
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    networks: [frontend, monitoring]       # UI qua Nginx /alertmanager/ (Basic Auth)
    deploy:
      resources:
        limits: { memory: 128m }

  # ---------- Exporter ----------
  node-exporter:                           # metrics máy chủ
    <<: *hardening
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    networks: [monitoring]

  cadvisor:                                # metrics từng container
    <<: *hardening
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --disable_metrics=disk,diskIO,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl
    # Ngoại lệ có chủ đích: cAdvisor cần đọc cgroup/Docker của host nên chạy privileged (chỉ đọc)
    privileged: true
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]

  mysqld-exporter:                         # metrics MySQL (user exporter chỉ đọc)
    <<: *hardening
    image: prom/mysqld-exporter:v0.16.0
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQLD_EXPORTER_PASSWORD:?}
    read_only: true
    cap_drop: [ALL]
    networks: [backend, monitoring]
    depends_on:
      mysql: { condition: service_healthy }

  nginx-exporter:                          # metrics Nginx từ stub_status
    <<: *hardening
    image: nginx/nginx-prometheus-exporter:1.3.0
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    read_only: true
    cap_drop: [ALL]
    networks: [monitoring]
    depends_on: [nginx]

  # =============== LOG TẬP TRUNG: Loki + Promtail ===============
  loki:
    <<: *hardening
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [monitoring]                 # không publish cổng, chỉ Grafana/Promtail gọi được
    deploy:
      resources:
        limits: { memory: 512m }

  promtail:
    <<: *hardening
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # đọc log container qua Docker API
      - promtail_data:/promtail
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [monitoring]
    depends_on: [loki]
    deploy:
      resources:
        limits: { memory: 256m }

# ---------------- Cô lập mạng ----------------
networks:
  frontend:            # Nginx <-> app, phpMyAdmin, Grafana, Prometheus
  backend:             # app, phpMyAdmin, exporter <-> MySQL; internal = không ra Internet
    internal: true
  monitoring:          # Prometheus <-> exporter, app; internal
    internal: true

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  promtail_data:
