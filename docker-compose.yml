# =============================================================
# Đề 17 - LMS đơn giản: triển khai toàn bộ bằng Docker Compose
# Chạy: ./scripts/setup.sh  &&  docker compose up -d --build
# =============================================================
name: lms

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ---------------- Cơ sở dữ liệu ----------------
  mysql:
    <<: *hardening
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Chạy scripts/setup.sh để tạo .env}
      MYSQL_ROOT_HOST: localhost          # root chỉ đăng nhập được từ bên trong container
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lms}
      MYSQL_USER: ${MYSQL_USER:-lms_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      DBA_PASSWORD: ${DBA_PASSWORD:?}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --local-infile=0                  # tắt LOAD DATA LOCAL
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]                    # KHÔNG mở cổng 3306 ra ngoài
    healthcheck:
      # ping qua TCP: chỉ báo healthy khi server thật đã lắng nghe (sau khi chạy xong init)
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1g }

  # ---------------- Công cụ quản lý DB ----------------
  phpmyadmin:
    <<: *hardening
    image: phpmyadmin:5.2
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://${DOMAIN:-localhost}/phpmyadmin/
      UPLOAD_LIMIT: 2M
      HIDE_PHP_VERSION: "true"
    volumes:
      - ./phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    networks: [frontend, backend]
    depends_on:
      mysql: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 256m }

  # ---------------- Ứng dụng LMS (Node.js/Express) ----------------
  app:
    <<: *hardening
    build: ./app
    image: lms-app:1.0
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-lms}
      DB_USER: ${MYSQL_USER:-lms_app}
      DB_PASSWORD: ${MYSQL_PASSWORD:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      COOKIE_SECURE: "true"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      LOG_LEVEL: info
    user: "1000:1000"                      # user "node", không phải root
    read_only: true                        # filesystem chỉ đọc
    tmpfs: [/tmp]
    cap_drop: [ALL]                        # bỏ toàn bộ Linux capabilities
    networks: [frontend, backend]
    depends_on:
      mysql: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512m }

  # ---------------- Reverse proxy ----------------
  nginx:
    <<: *hardening
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/auth:/etc/nginx/auth:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    networks: [frontend]
    depends_on:
      app: { condition: service_healthy }
      phpmyadmin: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1:8443/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { memory: 128m }

# ---------------- Cô lập mạng ----------------
networks:
  frontend:            # Nginx <-> app, phpMyAdmin
  backend:             # app, phpMyAdmin <-> MySQL; internal = không ra được Internet
    internal: true

volumes:
  mysql_data:
